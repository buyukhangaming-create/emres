<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0d1520;--bg2:#141f2e;--card:#182534;--card2:#1e2d3f;--line:#2a3b50;
--tx:#e8eef5;--tx2:#93a4b8;--tx3:#64788f;
--acc:#4ea3ff;--acc2:#1f6fc4;--ok:#33c481;--warn:#f0a92e;--bad:#ef5f5f;--ust:#4ea3ff;--alt:#c78af0;
--sa-t:env(safe-area-inset-top);--sa-b:env(safe-area-inset-bottom);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 font-size:16px;line-height:1.45;overscroll-behavior-y:none}
body{padding-bottom:calc(72px + var(--sa-b))}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);
 padding:9px 8px;width:100%;text-align:center;font-weight:600;font-size:17px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
input::placeholder{color:#3f5169;font-weight:400}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:rgba(13,21,32,.93);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);padding-top:var(--sa-t)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.htitle{font-size:19px;font-weight:800;letter-spacing:-.4px;flex:1;min-width:0}
.htitle small{display:block;font-size:11.5px;font-weight:500;color:var(--tx2);letter-spacing:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--card);display:flex;
 align-items:center;justify-content:center;font-size:17px;flex:none}
.seg{display:flex;background:var(--card);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.seg button.on{background:var(--acc);color:#04121f}

/* DAY CHIPS */
.days{display:flex;gap:7px;padding:2px 14px 11px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:1;min-width:70px;background:var(--card);border-radius:13px;padding:9px 6px;text-align:center;
 border:1.5px solid transparent;transition:.15s}
.chip .d{font-size:14px;font-weight:800;letter-spacing:.3px}
.chip .s{font-size:9.5px;color:var(--tx2);margin-top:2px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc)}
.chip.on .d,.chip.on .s{color:#04121f}
.chip.today::after{content:'';display:block;width:5px;height:5px;border-radius:50%;
 background:var(--ok);margin:3px auto 0}
.chip.on.today::after{background:#04121f}

/* WEEK BAR */
.weekbar{display:flex;align-items:center;gap:8px;padding:0 14px 10px}
.weekbar .wlab{flex:1;background:var(--card);border-radius:11px;padding:7px 12px;font-size:13px;font-weight:700;
 display:flex;align-items:center;justify-content:space-between}
.weekbar .wlab span{color:var(--tx2);font-weight:600;font-size:11.5px}
.wbtn{width:36px;height:34px;border-radius:10px;background:var(--card);font-size:18px;font-weight:700;
 display:flex;align-items:center;justify-content:center;flex:none}
.deload{color:var(--warn)!important}

/* PROGRESS */
.pbar{height:3px;background:var(--line);position:relative;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .3s;display:block}

main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:11.5px;color:var(--tx2)}

/* EXERCISE CARD */
.ex{background:var(--card);border-radius:16px;margin-bottom:11px;overflow:hidden;
 border:1px solid var(--line)}
.ex.done{border-color:rgba(51,196,129,.45)}
.exh{display:flex;gap:10px;padding:12px 13px 10px;align-items:flex-start}
.exn{width:26px;height:26px;border-radius:9px;background:var(--card2);color:var(--tx2);
 display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none;margin-top:1px}
.ex.done .exn{background:var(--ok);color:#04121f}
.exi{flex:1;min-width:0}
.exi h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:6px;background:var(--card2);color:var(--tx2)}
.tag.sets{background:rgba(78,163,255,.16);color:var(--acc)}
.tag.rir{background:rgba(240,169,46,.16);color:var(--warn)}
.tag.ust{background:rgba(78,163,255,.16);color:var(--ust)}
.tag.alt{background:rgba(199,138,240,.16);color:var(--alt)}
.last{font-size:11.5px;color:var(--tx2);margin-top:7px;display:flex;align-items:center;gap:6px}
.last b{color:var(--tx);font-weight:700}
.copybtn{font-size:10.5px;font-weight:700;background:var(--card2);color:var(--acc);
 padding:3px 8px;border-radius:6px;flex:none}

/* SET ROWS */
.sets{padding:0 13px 11px}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:7px;align-items:center;margin-bottom:7px}
.slab{font-size:11px;font-weight:800;color:var(--tx2);text-align:center}
.fld{position:relative}
.fld em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;
 font-size:10px;color:var(--tx3);pointer-events:none;font-weight:700}
.fld input{padding-right:24px}
.chk{width:44px;height:40px;border-radius:11px;background:var(--card2);display:flex;
 align-items:center;justify-content:center;font-size:17px;color:var(--tx3);transition:.15s}
.chk.on{background:var(--ok);color:#04121f}
.shead{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:7px;margin-bottom:5px}
.shead div{font-size:10px;font-weight:700;color:var(--tx3);text-align:center;letter-spacing:.4px}

.notebtn{width:100%;padding:9px 13px;background:var(--card2);font-size:12.5px;font-weight:700;
 color:var(--tx2);text-align:left;display:flex;justify-content:space-between;align-items:center}
.note{padding:11px 13px;font-size:13px;color:var(--tx2);background:var(--bg2);line-height:1.55;
 border-top:1px solid var(--line)}
.hidden{display:none}

/* SUMMARY */
.sum{background:linear-gradient(135deg,#16283d,#1b3350);border-radius:16px;padding:13px;
 margin-bottom:13px;display:flex;gap:10px;border:1px solid var(--line)}
.sum div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:center}
.sum .n{font-size:20px;font-weight:800;letter-spacing:-.5px;display:block;line-height:1.15}
.sum .l{font-size:9.5px;line-height:1.25;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}

/* REST TIMER */
#timer{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--sa-b) + 8px);z-index:60;
 background:var(--acc);color:#04121f;border-radius:15px;padding:11px 14px;display:none;
 align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timer.show{display:flex}
#timer .tnum{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#timer .tl{flex:1;font-size:12px;font-weight:700;line-height:1.3}
#timer button{background:rgba(0,0,0,.16);border-radius:9px;padding:7px 11px;font-size:12px;
 font-weight:800;color:#04121f}
#timer.zero{background:var(--ok)}

/* TABBAR */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,21,32,.96);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
 display:flex;padding-bottom:var(--sa-b)}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
 font-size:9.5px;font-weight:700;color:var(--tx3);letter-spacing:.2px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
 stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}

/* GENERIC CARD */
.c{background:var(--card);border-radius:16px;padding:13px;margin-bottom:11px;border:1px solid var(--line)}
.c h3{margin:0 0 9px;font-size:15px;font-weight:800;letter-spacing:-.2px}
.c h3 small{font-weight:600;color:var(--tx2);font-size:11.5px}
.row{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:13.5px;font-weight:600}
.row input{width:96px;flex:none}
h2.sec{font-size:12px;font-weight:800;color:var(--tx2);letter-spacing:1px;text-transform:uppercase;
 margin:20px 0 9px;padding-left:2px}
h2.sec:first-child{margin-top:2px}

/* MEAL */
.meal{display:flex;gap:11px;padding:12px 13px;background:var(--card);border-radius:15px;
 margin-bottom:9px;border:1px solid var(--line)}
.meal.done{opacity:.55;border-color:rgba(51,196,129,.4)}
.tick{width:26px;height:26px;border-radius:9px;background:var(--card2);flex:none;display:flex;
 align-items:center;justify-content:center;font-size:14px;color:var(--tx3);margin-top:1px}
.tick.on{background:var(--ok);color:#04121f}
.meal .mb{flex:1;min-width:0}
.meal .mt{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.meal .mt b{font-size:14px;font-weight:800;letter-spacing:-.2px}
.meal .mt span{font-size:11px;color:var(--tx2);font-weight:700}
.meal ul{margin:0;padding-left:15px}
.meal li{font-size:13px;color:var(--tx2);margin-bottom:2.5px;line-height:1.4}
.meal li.warn{color:var(--warn);font-weight:600;list-style:none;margin-left:-15px}
.macros{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.mc{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:6px;background:var(--card2);color:var(--tx2)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;color:var(--tx3);font-weight:800;letter-spacing:.4px;
 padding:0 5px 6px;text-transform:uppercase}
td{padding:7px 5px;border-top:1px solid var(--line);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.d-good{color:var(--ok)} .d-bad{color:var(--bad)}

/* SHEET */
#sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:none;
 align-items:flex-end;backdrop-filter:blur(3px)}
#sheet.show{display:flex}
.sheetc{background:var(--bg2);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
 padding:16px 15px calc(24px + var(--sa-b));border-top:1px solid var(--line)}
.grab{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--card);
 font-size:14.5px;font-weight:700;text-align:center;margin-bottom:9px}
.btn.pri{background:var(--acc);color:#04121f}
.btn.dan{background:rgba(239,95,95,.15);color:var(--bad)}
textarea{width:100%;height:130px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
 color:var(--tx);padding:11px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sa-b));
 background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;
 font-weight:700;z-index:100;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.stop{background:rgba(239,95,95,.1);border:1px solid rgba(239,95,95,.3)}
.stop b{color:var(--bad)}

/* BLOK BASLIKLARI */
.blk{display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding:8px 12px;
 background:linear-gradient(90deg,var(--acc2),rgba(31,111,196,.15));border-radius:11px;
 border-left:4px solid var(--acc)}
.blk b{font-size:13px;font-weight:800;letter-spacing:.7px;flex:1;color:#fff}
.blk span{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap}
.blk.ok{background:linear-gradient(90deg,rgba(51,196,129,.35),rgba(51,196,129,.08));border-left-color:var(--ok)}

.blkrule b{color:var(--tx);font-size:12.5px;display:block;margin-bottom:3px}

#rest{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;
 justify-content:center;background:var(--bg);padding:calc(18px + var(--sa-t)) 20px calc(18px + var(--sa-b));
 text-align:center;overscroll-behavior:contain}
#rest.show{display:flex}
#rest .rlab{font-size:12.5px;font-weight:800;letter-spacing:2.4px;color:var(--tx2);text-transform:uppercase}
#rest .rex{font-size:16.5px;font-weight:800;margin-top:5px;color:var(--tx);line-height:1.25;max-width:320px}
.rring{position:relative;width:min(74vw,290px);height:min(74vw,290px);margin:16px 0 10px}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring circle{fill:none;stroke-width:11;stroke-linecap:round}
.rring .rbg{stroke:var(--card2)}
.rring .rfg{stroke:var(--acc);transition:stroke-dashoffset .18s linear,stroke .2s}
.rnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:min(19vw,74px);font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.rnum small{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:var(--tx2);margin-top:2px}
.rnext{font-size:13.5px;color:var(--tx2);font-weight:600;max-width:330px;line-height:1.45;min-height:20px}
.rbtns{display:flex;gap:10px;margin-top:20px;width:100%;max-width:360px}
.rbtns button{flex:1;padding:15px 6px;border-radius:15px;background:var(--card);color:var(--tx);
 font-size:14.5px;font-weight:700;border:1px solid var(--line)}
.rbtns button.pri{background:var(--acc);color:#04121f;border-color:var(--acc)}
.rhint{font-size:11.5px;color:var(--tx3);margin-top:14px;max-width:320px;line-height:1.5}
#rest.zero{animation:flash .8s ease-in-out infinite}
#rest.zero .rfg{stroke:var(--ok)}
#rest.zero .rlab{color:var(--ok)}
@keyframes flash{0%,100%{background:var(--bg)}50%{background:#0f3d29}}
@media(prefers-reduced-motion:reduce){#rest.zero{animation:none;background:#0f3d29}}

/* ===== AYAR SATIRLARI ===== */
.stg{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--card);
 border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
.stg .si{flex:1;min-width:0}
.stg .si b{display:block;font-size:14px;font-weight:700}
.stg .si span{display:block;font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.4}
.sw{width:52px;height:31px;border-radius:16px;background:var(--card2);position:relative;flex:none;
 border:1px solid var(--line);transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:var(--tx2);transition:.18s}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on i{left:24px;background:#fff}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px;font-weight:800;color:var(--tx)}
.stepper b{min-width:44px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}

/* ===== ILERLEME GRAFIGI ===== */
.spark{margin:2px 0 8px;background:var(--bg);border-radius:10px;padding:8px 6px 4px}
.spark svg{display:block;width:100%;height:66px}
.sparkfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--tx2)}
.sparkfoot b{font-size:13px;color:var(--tx2);font-weight:800}
.sparkfoot b.up{color:var(--ok)} .sparkfoot b.dn{color:var(--warn)}
.exfoot{display:flex;gap:1px;border-top:1px solid var(--line)}
.exfoot .notebtn{flex:1;border-top:0}
.notebtn.open span{transform:rotate(180deg)}
.notebtn span{display:inline-block;transition:.15s}

/* ===== SESSION PILL ===== */
.sesspill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--tx2)}
.sesspill i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}

.help{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
 border-radius:12px;padding:12px 13px;margin-bottom:10px;font-size:12.5px;color:var(--tx2);line-height:1.55}
.help b{color:var(--tx);display:block;font-size:13.5px;margin-bottom:5px}
.help ol{margin:6px 0 0;padding-left:18px} .help li{margin-bottom:4px}

/* ===== KUCUK KRONOMETRE ===== */
.rghost{margin-top:13px;background:none;color:var(--tx2);font-size:12.5px;font-weight:700;padding:8px 10px}
#restMini{position:fixed;left:10px;right:10px;bottom:calc(70px + var(--sa-b));z-index:80;display:none;
 align-items:center;gap:11px;background:var(--acc2);border:1px solid var(--acc);border-radius:15px;
 padding:11px 12px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
#restMini.show{display:flex}
#restMini .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;min-width:60px;letter-spacing:-.5px}
#restMini .e{flex:1;min-width:0;font-size:11.5px;color:rgba(255,255,255,.86);font-weight:600;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
#restMini button{background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:800;
 padding:9px 13px;border-radius:10px;flex:none}
#restMini.zero{background:#17683f;border-color:var(--ok);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

</style>
</head>

const KEY='meb_fit_v1';
let MEM=null, useLS=true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ useLS=false; }
function load(){
  try{ const r = useLS ? localStorage.getItem(KEY) : MEM; if(r) return JSON.parse(r); }catch(e){}
  return {logs:{},meas:{},diet:{},supp:{},ui:{prog:'4g',day:null,week:1}};
}
function save(){
  const s=JSON.stringify(S);
  try{ if(useLS) localStorage.setItem(KEY,s); else MEM=s; }catch(e){ MEM=s; useLS=false; }
}
let S=load();
if(!S.ui) S.ui={prog:'4g',day:null,week:1};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const DELOAD=[5,10,15];

  if(DELOAD.includes(w)) return 'DELOAD · set sayısını %40 azalt · RIR 4';
  if(w<=4) return 'Blok 1 · Adaptasyon · RIR 3→2';
  if(w<=9) return 'Blok 2 · Yükleme · RIR 2';
  if(w<=14) return 'Blok 3 · Yoğunlaştırma · RIR 1-2';
  return 'Blok sonu · yeni plan';
}

}

/* ---------- AYARLAR ---------- */
function ST(){
  if(!S.set) S.set={};
  const d={sound:1,vib:1,wake:1,auto:1,notif:0,vol:0.9,cue:1,extra:0};
  for(const k in d) if(S.set[k]===undefined) S.set[k]=d[k];
  return S.set;
}
function setOpt(k,v){ ST()[k]=v; save(); renderSheet(); }
function togOpt(k){ setOpt(k, ST()[k]?0:1); if(k==='wake'){ ST().wake?wakeOn():wakeOff(); } }

/* ---------- SES MOTORU ---------- */
let AC=null, KEEP=null, CUES=[];
function acx(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  if(AC.state==='suspended'){ AC.resume().catch(()=>{}); }
  return AC;
}
let AUDIO_OK=false;
function unlockAudio(){
  const c=acx(); if(!c) return;
  try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource();
    s.buffer=b; s.connect(c.destination); s.start(0); AUDIO_OK=true; }catch(e){}
}
['touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

function tone(at,freq,dur,vol,type){
  const c=acx(); if(!c) return null;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,at);
    const v=Math.max(0.0015, vol*(ST().vol||0.9));
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v,at+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at+dur+0.06);
    CUES.push(o); return o;
  }catch(e){ return null; }
}
function clearCues(){ CUES.forEach(o=>{ try{o.stop();}catch(e){} }); CUES=[]; }
function scheduleCues(secLeft){
  clearCues();
  if(!ST().sound) return;
  const c=acx(); if(!c) return;
  const t0=c.currentTime+Math.max(0,secLeft);
  if(ST().cue){ [3,2,1].forEach(k=>{ if(secLeft>k+0.15) tone(t0-k,760,0.085,0.45); }); }
  tone(t0,      660,0.22,0.85);
  tone(t0+0.27, 880,0.22,0.9);
  tone(t0+0.54,1175,0.60,1.0);
  tone(t0+1.45, 880,0.18,0.7);
  tone(t0+1.70,1175,0.40,0.85);
}
function testAlarm(){ unlockAudio(); scheduleCues(0.25); buzz(); toast('Alarm sesi çalınıyor'); }
function keepOn(){ const c=acx(); if(!c||KEEP) return;
  try{ const o=c.createOscillator(), g=c.createGain();
    o.frequency.value=30; g.gain.value=0.0009; o.connect(g); g.connect(c.destination); o.start(); KEEP={o}; }catch(e){}
}
function keepOff(){ if(KEEP){ try{KEEP.o.stop();}catch(e){} KEEP=null; } }
function buzz(){ if(ST().vib && navigator.vibrate){ try{ navigator.vibrate([320,110,320,110,520]); }catch(e){} } }

/* ---------- EKRANI UYANIK TUT ---------- */
let WL=null;
async function wakeOn(){
  if(!ST().wake) return;
  try{ if('wakeLock' in navigator && !WL){ WL=await navigator.wakeLock.request('screen');
    WL.addEventListener('release',()=>{WL=null;}); } }catch(e){}
}
async function wakeOff(){ try{ if(WL){ await WL.release(); WL=null; } }catch(e){} }
function wakeSupported(){ return ('wakeLock' in navigator); }

/* ---------- BILDIRIM ---------- */
function notifSupported(){ return ('Notification' in window); }
async function askNotif(){
  if(!notifSupported()){ toast('Bu açılışta bildirim desteklenmiyor — uygulamayı bir web adresinden açın'); return; }
  try{ const p=await Notification.requestPermission();
    ST().notif = (p==='granted')?1:0; save(); renderSheet();
    toast(p==='granted'?'Bildirim izni verildi':'Bildirime izin verilmedi'); }
  catch(e){ toast('Bildirim izni alınamadı'); }
}
function notify(title,body){
  if(!ST().notif||!notifSupported()||Notification.permission!=='granted') return;
  const opt={body:body,tag:'meb-rest',renotify:true,requireInteraction:false,
    vibrate:[300,100,300],icon:'icon-192.png',badge:'icon-192.png'};
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)).catch(()=>{ new Notification(title,{body:body}); });
    } else { new Notification(title,{body:body}); }
  }catch(e){}
}

/* ---------- SEANS KRONOMETRESI ---------- */
function sessOn(){
  if(!S.sess || S.sess.d!==today() || !S.sess.t){ S.sess={d:today(),t:Date.now()}; save(); }
  wakeOn();
}
function sessTxt(){
  if(!S.sess||S.sess.d!==today()||!S.sess.t) return '—';
  const m=Math.floor((Date.now()-S.sess.t)/60000);
  return m<60 ? m+' dk' : Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
}

/* ---------- DINLENME KRONOMETRESI ---------- */
const R={on:false,end:0,total:0,ei:-1,si:-1,alarmed:false,iv:0,mini:false};
function paintMode(){
  $('rest').classList.toggle('show', R.on && !R.mini);
  $('restMini').classList.toggle('show', R.on && R.mini);
}
function restMini(){ R.mini=true; paintMode(); }
function restBig(){ R.mini=false; paintMode(); unlockAudio(); }
function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function nextTxt(ei,si){
  const d=curDay(); const e=d.ex[ei]; if(!e) return '';
  if(si+1 < e.s) return 'Sıradaki: '+(si+2)+'. set — '+e.n+'  ·  '+e.r+' tekrar, RIR '+e.rir;
  const nx=d.ex[ei+1];
  return nx ? 'Sıradaki hareket: '+nx.n+'  ·  '+nx.s+' × '+nx.r
            : 'Bu günün son seti — antrenman tamam.';
}
function startRest(sec,ei,si){
  R.on=true; R.ei=ei; R.si=si; R.total=sec; R.end=Date.now()+sec*1000; R.alarmed=false;
  S.rest={end:R.end,total:sec,ei:ei,si:si,day:S.ui.day,prog:S.ui.prog,week:S.ui.week}; save();
  const e=curDay().ex[ei];
  $('rEx').textContent = e ? e.n : '';
  $('rNext').textContent = nextTxt(ei,si);
  $('rHint').textContent = ST().sound
      ? (wakeSupported()&&ST().wake ? 'Ekran açık kalacak, süre bitince alarm çalacak.'
                                    : 'Süre bitince alarm çalacak. Sesin duyulması için telefonun zil anahtarı açık olmalı.')
      : 'Ses kapalı — ekran yeşile döndüğünde süre dolmuş demektir.';
  R.mini=false; paintMode();
  $('rest').classList.remove('zero'); $('restMini').classList.remove('zero');
  $('rmEx').textContent = e ? e.n : 'Dinlenme';
  $('rLab').textContent='DİNLENME'; $('rSub').textContent='KALAN';
  unlockAudio(); scheduleCues(sec); if(ST().extra) keepOn(); wakeOn();
  paintRest(); clearInterval(R.iv); R.iv=setInterval(paintRest,150);
}
function paintRest(){
  if(!R.on) return;
  const left=(R.end-Date.now())/1000;
  const C=552.9;
  if(left>0){
    const t=fmt(left);
    $('rNum').textContent=t; $('rmNum').textContent=t;
    $('rFg').setAttribute('stroke-dashoffset', String(C*(1-Math.max(0,Math.min(1,left/R.total)))));
  } else {
    if(!R.alarmed){ R.alarmed=true; onRestEnd(); }
    const t='+'+fmt(-left);
    $('rNum').textContent=t; $('rmNum').textContent=t;
    $('rSub').textContent='GECİKME';
    $('rFg').setAttribute('stroke-dashoffset','0');
    if(-left>180) restStop(false);
  }
}
function onRestEnd(){
  $('rest').classList.add('zero'); $('restMini').classList.add('zero');
  $('rLab').textContent='SÜRE DOLDU'; $('rmEx').textContent='Süre doldu — sıradaki set';
  if(R.mini){ R.mini=false; paintMode(); }
  buzz();
  const e=curDay().ex[R.ei];
  notify('Dinlenme bitti', e ? nextTxt(R.ei,R.si) : 'Sıradaki sete geçin');
  if(document.hidden){ /* uyandiginda ses zaten planlandi */ }
}
function restAdd(s){
  if(!R.on) return;
  const left=(R.end-Date.now())/1000;
  const nl=Math.max(5,left+s);
  R.end=Date.now()+nl*1000; R.total=Math.max(R.total,nl); R.alarmed=false;
  $('rest').classList.remove('zero'); $('restMini').classList.remove('zero');
  $('rLab').textContent='DİNLENME'; $('rSub').textContent='KALAN';
  if(S.rest){ S.rest.end=R.end; S.rest.total=R.total; save(); }
  scheduleCues(nl); paintRest();
}
function restStop(manual){
  clearInterval(R.iv); R.on=false; R.alarmed=false; R.mini=false; clearCues(); keepOff();
  $('rest').classList.remove('show','zero'); $('restMini').classList.remove('show','zero');
  S.rest=null; save();
  if(manual) unlockAudio();
}
function restResume(){
  const r=S.rest; if(!r||!r.end) return;
  if(r.prog!==S.ui.prog||r.day!==S.ui.day||r.week!==S.ui.week){ S.rest=null; save(); return; }
  const left=(r.end-Date.now())/1000;
  if(left<-120){ S.rest=null; save(); return; }
  R.on=true; R.ei=r.ei; R.si=r.si; R.total=r.total; R.end=r.end; R.alarmed=left<=0;
  const e=curDay().ex[r.ei];
  $('rEx').textContent=e?e.n:''; $('rmEx').textContent=e?e.n:'Dinlenme';
  $('rNext').textContent=nextTxt(r.ei,r.si);
  R.mini=false; paintMode();
  if(left>0){ scheduleCues(left); } else { $('rest').classList.add('zero'); $('rLab').textContent='SÜRE DOLDU'; }
  clearInterval(R.iv); R.iv=setInterval(paintRest,150); paintRest();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  acx();
  if(R.on){
    const left=(R.end-Date.now())/1000;
    if(left>0){ scheduleCues(left); } else if(!R.alarmed){ R.alarmed=true; onRestEnd(); }
    paintRest();
  }
  if(ST().wake && S.sess && S.sess.d===today()) wakeOn();
});
/* eski API ile uyum */
function startTimer(sec,label){ startRest(sec,R.ei>=0?R.ei:0,R.si>=0?R.si:0); }
function stopTimer(){ restStop(true); }

function setDay(id){ S.ui.day=id; save(); render(); }


function tgl(btn,k){
  const card=btn.closest('.ex'), el=card.querySelector('[data-k="'+k+'"]');
  el.classList.toggle('hidden'); btn.classList.toggle('open');
}
function progData(ei){
  const ex=curDay().ex[ei], out=[];
  for(let w=1;w<=16;w++){
    let mx=null, reps=[];
    for(let si=0;si<ex.s;si++){ const o=get(ei,si,w);
      if(o.kg!==undefined&&!isNaN(o.kg)&&o.kg>0) mx=(mx===null)?o.kg:Math.max(mx,o.kg);
      if(o.reps!==undefined&&!isNaN(o.reps)) reps.push(o.reps); }
    if(mx!==null) out.push({w:w,kg:mx,reps:reps});
  }
  return out;
}
function progPanel(ei){
  const d=progData(ei);
  if(d.length<2) return `<div class="note hidden" data-k="prog"><div class="tiny" style="color:var(--tx2)">
    En az iki farklı haftada kilo girildiğinde ilerleme grafiğiniz burada çizilir. Şu ana kadar ${d.length} hafta kaydı var.</div></div>`;
  const kg=d.map(x=>x.kg), mn=Math.min.apply(null,kg), mx=Math.max.apply(null,kg), rng=(mx-mn)||1;
  const W=300,H=66,P=8;
  const X=i=>P+i*(W-2*P)/(d.length-1), Y=v=>H-P-((v-mn)/rng)*(H-2*P);
  const pts=d.map((x,i)=>X(i).toFixed(1)+','+Y(x.kg).toFixed(1)).join(' ');
  const area=P+','+H+' '+pts+' '+(W-P)+','+H;
  const f=d[0], l=d[d.length-1], dl=+(l.kg-f.kg).toFixed(1), pc=f.kg?Math.round((l.kg-f.kg)/f.kg*100):0;
  return `<div class="note hidden" data-k="prog">
    <div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon points="${area}" fill="rgba(78,163,255,.13)"/>
      <polyline points="${pts}" fill="none" stroke="#4ea3ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${d.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="${i===d.length-1?3.6:2.3}" fill="${i===d.length-1?'#ffffff':'#4ea3ff'}"/>`).join('')}
    </svg></div>
    <div class="sparkfoot"><span>Hf ${f.w} · ${f.kg} kg</span>
      <b class="${dl>0?'up':(dl<0?'dn':'')}">${dl>0?'+':''}${dl} kg${f.kg?' · %'+pc:''}</b>
      <span>Hf ${l.w} · ${l.kg} kg</span></div>
    <div class="tiny" style="color:var(--tx3);margin-top:7px">Grafik, o hareketteki en ağır çalışma setini gösterir.
    Çift ilerleme kuralı: tüm setlerde tekrar aralığının üst sınırına ulaştığınızda ağırlığı artırıp alt sınırdan başlayın.</div>
  </div>`;
}

/* ---------- ANTRENMAN ---------- */
function toggleSet(ei,si){
  const e=curDay().ex[ei];
  const k=lk(ei,si), o=S.logs[k]||{};
  o.done=!o.done;
  if(o.done && o.reps===undefined){ const pr=get(ei,si,S.ui.week-1); if(pr.reps!==undefined) o.reps=pr.reps; }
  S.logs[k]=o; save();
  if(o.done){ sessOn(); if(ST().auto && e && e.rest) startRest(e.rest,ei,si); }
  renderW();
}
function setVal(ei,si,f,v){
  const k=lk(ei,si), o=S.logs[k]||{};
  o[f]= v===''?undefined:parseFloat(String(v).replace(',','.'));
  S.logs[k]=o; save(); updateSummary();
}
function copyPrev(ei){
  if(S.ui.week<2){toast('1. haftada önceki kayıt yok');return;}
  const ex=curDay().ex[ei]; let n=0;
  for(let si=0;si<ex.s;si++){ const p=get(ei,si,S.ui.week-1);
    if(p.kg!==undefined){ const k=lk(ei,si),o=S.logs[k]||{}; o.kg=p.kg; S.logs[k]=o; n++; } }
  save(); renderW(); toast(n?n+' sete geçen haftanın kilosu yazıldı':'Geçen haftadan kayıt yok');
}
function prevTxt(ei){
  const ex=curDay().ex[ei]; if(S.ui.week<2) return '';
  let kg=null,reps=[];
  for(let si=0;si<ex.s;si++){ const p=get(ei,si,S.ui.week-1);
    if(p.kg!==undefined) kg=p.kg; if(p.reps!==undefined) reps.push(p.reps); }
  if(kg===null&&!reps.length) return '';
  return (kg!==null?kg+' kg':'')+(reps.length?' · '+reps.join('/'):'');
}
function updateSummary(){
  const d=curDay(); let tot=0,done=0,vol=0;
  d.ex.forEach((e,ei)=>{ for(let si=0;si<e.s;si++){ tot++; const o=get(ei,si);
    if(o.done)done++; if(o.kg&&o.reps) vol+=o.kg*o.reps; }});
  const pc=tot?Math.round(done/tot*100):0;
  $('pBar').style.width=pc+'%';
  const s=$('sumBox'); if(s) s.innerHTML=
    `<div><span class="n">${done}/${tot}</span><span class="l">Set</span></div>
     <div><span class="n">${pc}%</span><span class="l">Tamamlandı</span></div>
     <div><span class="n">${vol>=1000?(vol/1000).toFixed(1)+'t':Math.round(vol)}</span><span class="l">Hacim (kg)</span></div>
     <div><span class="n">${sessTxt()}</span><span class="l">Seans</span></div>`;
}
function warnBanner(){
  return useLS ? '' : `<div class="c stop" style="padding:11px 13px;margin-bottom:11px">
    <b>⚠ Kayıt kapalı</b>
    <div class="tiny" style="color:var(--tx2);margin-top:4px">Bu açılış şeklinde tarayıcı veri saklamıyor; uygulamayı kapatınca girdikleriniz silinir.
    Antrenman bitince ⚙︎ → "Yedeği dosya olarak indir" ile kaydedin.</div></div>`;
}
function renderW(){
  const d=curDay();
  let h=warnBanner()+`<div class="sum" id="sumBox"></div>`+`<div class="blkrule"><b>Blok kuralı</b>Bir bloğun tüm hareketleri ve tüm setleri bitmeden bir sonraki bloğa geçilmez. İstasyon meşgulse sırayı değil, hareketi değiştirin.</div>`;
  if(DELOAD.includes(S.ui.week)) h+=`<div class="c" style="border-color:rgba(240,169,46,.4);background:rgba(240,169,46,.08)">
    <b style="color:var(--warn);font-size:14px">⚠ DELOAD HAFTASI</b>
    <p class="tiny" style="margin:5px 0 0;color:var(--tx2)">Her egzersizin set sayısını %40 azaltın (4 set→2, 3 set→2), ağırlığı ve tekrarı aynı tutun, RIR 4'te kalın. Antrenman sayısını değiştirmeyin.</p></div>`;
  let _pb=null;
  h+=d.ex.map((e,ei)=>{
    let allDone=true; for(let si=0;si<e.s;si++) if(!get(ei,si).done) allDone=false;
    const pv=prevTxt(ei);
    let rows=`<div class="shead"><div></div><div>KG</div><div>TEKRAR</div><div></div></div>`;
    for(let si=0;si<e.s;si++){ const o=get(ei,si);
      rows+=`<div class="srow">
        <div class="slab">${si+1}</div>
        <div class="fld"><input inputmode="decimal" placeholder="—" value="${o.kg??''}"
           onchange="setVal(${ei},${si},'kg',this.value)"><em>kg</em></div>
        <div class="fld"><input inputmode="numeric" placeholder="—" value="${o.reps??''}"
           onchange="setVal(${ei},${si},'reps',this.value)"><em>tk</em></div>
        <button class="chk ${o.done?'on':''}" onclick="toggleSet(${ei},${si})">✓</button>
      </div>`; }
    let bh='';
    if(e.blk && e.blk!==_pb){ _pb=e.blk;
      const bx=d.ex.filter(x=>x.blk===e.blk);
      const bs=bx.reduce((a,b)=>a+b.s,0);
      let bd=0,bt=0; bx.forEach(x=>{const xi=d.ex.indexOf(x); for(let si=0;si<x.s;si++){bt++; if(get(xi,si).done) bd++;}});
      bh=`<div class="blk ${bd===bt?'ok':''}"><b>${esc(e.blk)}</b><span>${bx.length} hareket · ${bs} set · ${bd}/${bt}</span></div>`;
    }
    return bh+`<div class="ex ${allDone?'done':''}">
      <div class="exh">
        <div class="exn">${ei+1}</div>
        <div class="exi">
          <h3>${esc(e.n)}</h3>
          <div class="tags"><span class="tag sets">${e.s} × ${esc(e.r)}</span>
            <span class="tag rir">RIR ${esc(e.rir)}</span>
            <span class="tag">${e.rest>=60?Math.round(e.rest/60*10)/10+' dk':e.rest+' sn'} dinlenme</span>
            <span class="tag ${e.t}">${e.t==='ust'?'üst vücut':'alt vücut'}</span></div>
          ${pv?`<div class="last">Geçen hafta: <b>${esc(pv)}</b>
            <button class="copybtn" onclick="copyPrev(${ei})">kopyala</button></div>`:''}
        </div>
      </div>
      <div class="sets">${rows}</div>
      <div class="exfoot">
        <button class="notebtn" onclick="tgl(this,'note')">Teknik notu<span>⌄</span></button>
        <button class="notebtn" onclick="tgl(this,'prog')">İlerleme<span>⌄</span></button>
      </div>
      <div class="note hidden" data-k="note">${esc(e.note)}</div>
      ${progPanel(ei)}
    </div>`;
  }).join('');
  h+=`<div class="c" style="margin-top:4px"><h3>Isınma <small>her antrenman öncesi</small></h3>
    <p class="tiny" style="margin:0;color:var(--tx2)">5 dk hafif bisiklet → Cat-Cow 10 tekrar → Band Pull-Apart 2×15 → ilk hareketin çalışma ağırlığının %50'siyle 1×10, %75'iyle 1×5. Bu ısınma setleri yukarıdaki set sayılarına dahil değildir.</p></div>`;
  $('app').innerHTML=h; updateSummary();
}

/* ---------- ÖLÇÜM ---------- */
const MF=[['kilo','Kilo (kg)','0.0'],['bel','BEL çevresi (cm)','0.0'],['gogus','Göğüs (cm)',''],
  ['kol','Kol (cm)',''],['uyluk','Uyluk (cm)',''],['omuz','Omuz (cm)',''],['uyku','Uyku (saat/gece)','']];
function setMeas(w,f,v){ S.meas[w]=S.meas[w]||{}; S.meas[w][f]= v===''?undefined:parseFloat(String(v).replace(',','.'));
  save(); renderM(); }
function renderM(){
  const w=S.ui.week, cur=S.meas[w]||{}, base=S.meas[0]||{};
  let h=`<div class="c" style="border-color:rgba(78,163,255,.35)">
    <h3>Bel çevresi neden birincil metrik?</h3>
    <p class="tiny" style="margin:0;color:var(--tx2)">Rekomposizyonda terazi kıpırdamaz. Kilo sabitken belin düşmesi = yağ azalıyor, kas artıyor. Ölçümü göbek deliği hizasından, sabah aç karna, nefes verdikten sonra ve karnı içeri çekmeden alın.</p></div>`;
  h+=`<h2 class="sec">Baz ölçüm (başlangıç)</h2><div class="c">`;
  MF.forEach(([f,l])=>h+=`<div class="row"><label>${l}</label>
    <input inputmode="decimal" placeholder="—" value="${base[f]??''}" onchange="setMeas(0,'${f}',this.value)"></div>`);
  h+=`</div><h2 class="sec">Hafta ${w} ölçümü</h2><div class="c">`;
  MF.forEach(([f,l])=>{
    const d=(cur[f]!==undefined&&base[f]!==undefined)?(cur[f]-base[f]):null;
    const good = f==='bel' ? (d<0) : (f==='kilo' ? Math.abs(d)<1.5 : d>0);
    h+=`<div class="row"><label>${l}${d!==null?` <span class="tiny ${good?'d-good':'d-bad'}">(${d>0?'+':''}${d.toFixed(1)})</span>`:''}</label>
      <input inputmode="decimal" placeholder="—" value="${cur[f]??''}" onchange="setMeas(${w},'${f}',this.value)"></div>`;});
  h+=`</div>`;
  const ws=Object.keys(S.meas).map(Number).filter(x=>x>0&&(S.meas[x].kilo!==undefined||S.meas[x].bel!==undefined)).sort((a,b)=>a-b);
  if(ws.length){ h+=`<h2 class="sec">Geçmiş</h2><div class="c"><table>
    <tr><th>Hf</th><th class="num">Kilo</th><th class="num">Bel</th><th class="num">Δ Bel</th></tr>`;
    ws.forEach(x=>{const m=S.meas[x], db=(m.bel!==undefined&&base.bel!==undefined)?(m.bel-base.bel):null;
      h+=`<tr><td>${x}</td><td class="num">${m.kilo??'—'}</td><td class="num">${m.bel??'—'}</td>
        <td class="num ${db!==null?(db<0?'d-good':'d-bad'):''}">${db!==null?(db>0?'+':'')+db.toFixed(1):'—'}</td></tr>`;});
    h+=`</table></div>`; }
  h+=`<h2 class="sec">Nasıl yorumlanır</h2>`;
  [['Kilo sabit · Bel azalıyor · Ağırlıklar artıyor','İDEAL','Hiçbir şey değiştirmeyin.','ok'],
   ['Kilo +1 kg/ay · Bel artıyor','FAZLA KALORİ','Antrenman günü kalorisini 150-200 azaltın (pilavdan 50 g düşürün). Adımı 10.000\'e çıkarın.','warn'],
   ['Kilo −1 kg/aydan hızlı · Ağırlıklar düşüyor','AÇIK ÇOK FAZLA','Dinlenme günü kalorisini 150-200 artırın. Kas kaybediyorsunuz.','bad'],
   ['Kilo sabit · Bel sabit · Ağırlıklar sabit','DURGUNLUK','Uyku, protein, RIR ve kayıt tutmayı kontrol edin. Hepsi tamamsa deload yapıp yeni bloğa geçin.','warn']]
   .forEach(([a,b,c,col])=>h+=`<div class="c" style="padding:11px 13px"><div style="font-size:13px;font-weight:700">${a}</div>
     <div style="font-size:11px;font-weight:800;color:var(--${col});margin:4px 0 3px;letter-spacing:.5px">${b}</div>
     <div class="tiny" style="color:var(--tx2)">${c}</div></div>`);
  h+=`<div class="c"><h3>16 hafta hedefi</h3><table>
    <tr><th>Metrik</th><th>Bugün</th><th>16. Hafta</th></tr>
    <tr><td>Vücut ağırlığı</td><td>72 kg</td><td>72–74 kg</td></tr>
    <tr><td><b>Bel çevresi</b></td><td>baz</td><td class="d-good"><b>−3 ila −5 cm</b></td></tr>
    <tr><td>Yağsız kütle</td><td>—</td><td class="d-good">+2 ila +3 kg</td></tr>
    <tr><td>Vücut yağı</td><td>~%17–20</td><td class="d-good">~%13–15</td></tr></table>
    <p class="tiny" style="margin:9px 0 0;color:var(--tx2)">Terazi neredeyse hiç kıpırdamayacak. Bu başarısızlık değil, planın tam olarak istediği şey.</p></div>`;
  $('app').innerHTML=h;
}

/* ---------- DİYET ---------- */
function dietType(){ const dow=new Date().getDay(); const auto=[1,2,4,5].includes(dow)?'antrenman':'dinlenme';
  return S.ui.dt || auto; }
function setDT(t){ S.ui.dt=t; save(); renderD(); }
function tickMeal(i){ const k=today()+'|'+dietType()+'|'+i; S.diet[k]=!S.diet[k]; save(); renderD(); }
function renderD(){
  const t=dietType(), D=DIET[t];
  let done=0; D.meals.forEach((m,i)=>{ if(S.diet[today()+'|'+t+'|'+i]) done++; });
  const kc=D.meals.reduce((a,m,i)=>a+(S.diet[today()+'|'+t+'|'+i]?m.kcal:0),0);
  const pr=D.meals.reduce((a,m,i)=>a+(S.diet[today()+'|'+t+'|'+i]?m.p:0),0);
  let h=`<div class="seg" style="width:100%;margin-bottom:12px">
    <button style="flex:1" class="${t==='antrenman'?'on':''}" onclick="setDT('antrenman')">Antrenman Günü</button>
    <button style="flex:1" class="${t==='dinlenme'?'on':''}" onclick="setDT('dinlenme')">Dinlenme Günü</button></div>
   <div class="sum">
     <div><span class="n">${kc}</span><span class="l">/ ${D.kcal} kcal</span></div>
     <div><span class="n">${pr}</span><span class="l">/ ${D.p} g protein</span></div>
     <div><span class="n">${done}/${D.meals.length}</span><span class="l">Öğün</span></div></div>`;
  h+=D.meals.map((m,i)=>{ const on=!!S.diet[today()+'|'+t+'|'+i];
    return `<div class="meal ${on?'done':''}" onclick="tickMeal(${i})">
      <div class="tick ${on?'on':''}">✓</div>
      <div class="mb"><div class="mt"><b>${esc(m.n)}</b><span>${esc(m.t)}</span></div>
      <ul>${m.items.map(x=>`<li class="${x.startsWith('⚠')?'warn':''}">${esc(x)}</li>`).join('')}</ul>
      <div class="macros"><span class="mc">${m.kcal} kcal</span><span class="mc">P ${m.p}</span>
        <span class="mc">K ${m.k}</span><span class="mc">Y ${m.y}</span></div></div></div>`;}).join('');
  h+=`<h2 class="sec">Değişim tablosu</h2><div class="c">
   <p style="margin:0 0 8px;font-size:13px"><b>≈30 g protein</b><br><span class="tiny" style="color:var(--tx2)">100 g pişmiş tavuk ≈ 100 g hindi ≈ 110 g yağsız dana ≈ 135 g somon ≈ 130 g ton balığı ≈ 5 tam yumurta ≈ 300 g süzme yoğurt ≈ 1 ölçek whey</span></p>
   <p style="margin:0 0 8px;font-size:13px"><b>≈30 g karbonhidrat</b><br><span class="tiny" style="color:var(--tx2)">100 g pirinç pilavı ≈ 120 g bulgur ≈ 150 g haşlanmış patates ≈ 70 g tam buğday ekmeği ≈ 50 g kuru yulaf ≈ 110 g haşlanmış makarna ≈ 1 büyük muz</span></p>
   <p style="margin:0;font-size:13px"><b>≈5 g yağ</b><br><span class="tiny" style="color:var(--tx2)">1 tatlı kaşığı zeytinyağı ≈ 8 badem ≈ 10 g fıstık ezmesi ≈ 25 g avokado ≈ 10 zeytin</span></p></div>
   <h2 class="sec">Kurallar</h2><div class="c">
   <p style="margin:0 0 7px;font-size:13px">💧 <b>Su:</b> günde 3–3,5 litre (kreatin kullanıyorsunuz)</p>
   <p style="margin:0 0 7px;font-size:13px">🥗 <b>Sınırsız:</b> yeşil yapraklılar, salatalık, biber, kabak, brokoli, karnabahar, turp, mantar, maydanoz-roka, limon, baharat, şekersiz çay/kahve. Günde en az 2 avuç yeşil sebze.</p>
   <p style="margin:0 0 7px;font-size:13px">🍕 <b>Haftada 1 serbest ÖĞÜN</b> (gün değil). Antrenman gününde ve öğle saatinde olsun. Makro saymayın, ertesi gün telafi etmeyin.</p>
   <p style="margin:0;font-size:13px">🔥 <b>Günlük 8.000–10.000 adım.</b> Programın en verimli tek maddesi; toparlanmayı hiç etkilemez.</p></div>
   <h2 class="sec">Reflü için</h2><div class="c">
   <p class="tiny" style="margin:0;color:var(--tx2);line-height:1.7">• Son katı öğün ile yatış arası en az 3 saat<br>• Yatak başını 10–15 cm yükseltin (yastık değil, takoz)<br>• Sol yanınıza yatın<br>• Antrenman öncesi büyük öğün yemeyin<br>• Karın egzersizlerini antrenmanın sonuna alın, öğünden 2 saat sonra<br>• Shake'i 5–10 dakikaya yayarak için<br>• Tetikleyiciler: domates-salça, nane, çikolata, kızartma, gazlı içecek, alkol</p></div>`;
  $('app').innerHTML=h;
}

/* ---------- TAKVİYE ---------- */
function suppType(){ const dow=new Date().getDay(); return S.ui.st || ([1,2,4,5].includes(dow)?'antrenman':'dinlenme'); }
function setST(t){ S.ui.st=t; save(); renderS(); }
function tickSupp(i){ const k=today()+'|s|'+suppType()+'|'+i; S.supp[k]=!S.supp[k]; save(); renderS(); }
function renderS(){
  const t=suppType(), L=SUPP[t];
  const done=L.filter((_,i)=>S.supp[today()+'|s|'+t+'|'+i]).length;
  let h=`<div class="seg" style="width:100%;margin-bottom:12px">
    <button style="flex:1" class="${t==='antrenman'?'on':''}" onclick="setST('antrenman')">Antrenman Günü</button>
    <button style="flex:1" class="${t==='dinlenme'?'on':''}" onclick="setST('dinlenme')">Dinlenme Günü</button></div>
   <div class="sum"><div><span class="n">${done}/${L.length}</span><span class="l">Bugün alınan</span></div>
     <div><span class="n">3</span><span class="l">Kanıtlı ürün</span></div>
     <div><span class="n">5</span><span class="l">Bırakılan</span></div></div>`;
  h+=L.map((s,i)=>{ const on=!!S.supp[today()+'|s|'+t+'|'+i];
    return `<div class="meal ${on?'done':''}" onclick="tickSupp(${i})"><div class="tick ${on?'on':''}">✓</div>
      <div class="mb"><div class="mt"><b>${esc(s.n)}</b><span>${esc(s.t)}</span></div>
      <div class="tiny" style="color:var(--tx2)">${esc(s.d)}</div></div></div>`;}).join('');
  h+=`<h2 class="sec">Kullanılmayacaklar</h2>`;
  h+=SUPP.birak.map(x=>`<div class="c stop" style="padding:11px 13px">
    <b style="font-size:13.5px">✕ ${esc(x.n)}</b>
    <div class="tiny" style="color:var(--tx2);margin-top:4px">${esc(x.r)}</div></div>`).join('');
  h+=`<h2 class="sec">Notlar</h2><div class="c">
    <p style="margin:0 0 8px;font-size:13px"><b>Kreatin</b> — 5 g/gün, HER GÜN (antrenman olmayan günler dahil). Yükleme gereksiz. Yemekle ve 250–300 ml suyla (reflü).</p>
    <p style="margin:0 0 8px;font-size:13px"><b>D vitamini</b> — 1000 IU idame dozudur, eksikliği düzeltmez. 25(OH)D kan sonucunuza göre doz artırılmalı (hekim kontrolünde).</p>
    <p style="margin:0 0 8px;font-size:13px"><b>Omega-3</b> — geğirme olursa kapsülleri buzlukta saklayın, öğünün ortasında alın.</p>
    <p style="margin:0;font-size:13px"><b>Gainer bittiğinde</b> saf whey protein alın: aynı proteini üçte bir kalori ile alırsınız (358 kcal → 120 kcal).</p></div>`;
  $('app').innerHTML=h;
}

/* ---------- YEDEK ---------- */
function sw(on){ return '<div class="sw '+(on?'on':'')+'"><i></i></div>'; }
function renderSheet(){
  const s=ST();
  const rec = useLS
    ? '<b style="color:var(--ok)">✓ Kayıt açık</b><br><span class="tiny">Girdikleriniz bu telefonda otomatik saklanıyor.</span>'
    : '<b style="color:var(--bad)">✗ Kayıt kapalı</b><br><span class="tiny">Bu açılışta tarayıcı veri saklamıyor — kapatınca kayıtlar silinir. Aşağıdan yedek alın veya uygulamayı Ana Ekrandan açın.</span>';
  const std = (window.navigator.standalone===true) || (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  let h=`<div class="grab"></div>
  <h3 style="margin:0 0 4px;font-size:18px;font-weight:800">Ayarlar</h3>
  <p class="tiny" style="margin:0 0 14px">Verileriniz yalnızca bu telefonda saklanır, hiçbir yere gönderilmez.</p>

  <h2 class="sec" style="margin-top:2px">Dinlenme uyarısı</h2>
  <div class="stg" onclick="togOpt('sound')"><div class="si"><b>Alarm sesi</b>
    <span>Süre bitince yükselen üçlü alarm. iPhone'da sesin duyulması için zil anahtarının açık olması gerekir.</span></div>${sw(s.sound)}</div>
  <div class="stg" onclick="togOpt('cue')"><div class="si"><b>Son 3 saniye bipleri</b>
    <span>Sürenin bitmesine 3, 2, 1 kala kısa uyarı sesi.</span></div>${sw(s.cue)}</div>
  <div class="stg" onclick="togOpt('auto')"><div class="si"><b>Seti işaretleyince otomatik başlat</b>
    <span>✓ tuşuna bastığınızda o hareketin dinlenme süresi kendiliğinden başlar.</span></div>${sw(s.auto)}</div>
  <div class="stg" onclick="togOpt('vib')"><div class="si"><b>Titreşim</b>
    <span>${navigator.vibrate?'Destekleniyor.':"iPhone Safari titreşim API'sini desteklemiyor — bu cihazda çalışmaz. Titreşim için aşağıdan bildirim iznini açın."}</span></div>${sw(s.vib)}</div>
  <div class="stg"><div class="si"><b>Alarm ses seviyesi</b><span>Cihaz sesinden bağımsız uygulama içi seviye.</span></div>
    <div class="stepper"><button onclick="event.stopPropagation();setOpt('vol',Math.max(0.2,Math.round((ST().vol-0.2)*10)/10))">−</button>
      <b>%${Math.round(s.vol*100)}</b>
      <button onclick="event.stopPropagation();setOpt('vol',Math.min(1,Math.round((ST().vol+0.2)*10)/10))">+</button></div></div>
  <button class="btn" onclick="testAlarm()">🔊 Alarmı test et</button>

  <h2 class="sec">Ekran ve bildirim</h2>
  <div class="stg" onclick="togOpt('wake')"><div class="si"><b>Antrenman boyunca ekran açık kalsın</b>
    <span>${wakeSupported()?'Destekleniyor. Ekran kilitlenmez, kronometre kesintisiz çalışır.':'Bu açılışta kullanılamıyor (güvenli adres gerekir). Uygulamayı web adresinden açarsanız etkinleşir.'}</span></div>${sw(s.wake)}</div>
  <div class="stg" onclick="togOpt('extra')"><div class="si"><b>Arka planda alarm (deneysel)</b>
    <span>Ekran kilitlense veya başka uygulamaya geçseniz de alarmın çalması için ses oturumunu açık tutar. Pili bir miktar daha fazla kullanır.</span></div>${sw(s.extra)}</div>
  <div class="stg"><div class="si"><b>Bildirim + sistem titreşimi</b>
    <span>${!notifSupported()?'Bu açılışta kullanılamıyor — uygulamayı bir web adresinden açın.':(Notification.permission==='granted'?'İzin verildi. Süre bitince iPhone bildirim sesi ve titreşimi gelir; telefon sessizdeyken de hissedilir.':'İzin verilmedi. Sessiz moddayken de uyarı almanın tek yolu budur.')}</span></div>
    <button class="btn" style="width:auto;padding:9px 14px;margin:0;flex:none" onclick="askNotif()">${notifSupported()&&Notification.permission==='granted'?'Açık':'İzin ver'}</button></div>

  <h2 class="sec">Kurulum</h2>`;
  if(!std) h+=`<div class="help"><b>Ana Ekrana ekleyin</b>
    Uygulamayı tam ekran ve kendi simgesiyle kullanmak için:
    <ol><li>Safari'de alttaki <b>Paylaş</b> tuşuna basın</li>
    <li><b>Ana Ekrana Ekle</b>'yi seçin</li><li>Adını <b>MEB Fit</b> yapıp <b>Ekle</b>'ye basın</li></ol>
    Bundan sonra ana ekrandaki simgeden açın — adres çubuğu olmadan, uygulama gibi çalışır.</div>`;
  else h+=`<div class="help"><b>✓ Uygulama modunda çalışıyor</b>Ana Ekrandan açıldı; tam ekran ve kendi kaydıyla çalışıyor.</div>`;

  h+=`<h2 class="sec">Yedek</h2>
  <div class="c" style="margin:0 0 12px;font-size:13.5px">${rec}</div>
  <button class="btn pri" onclick="downloadBackup()">⬇︎ Yedeği dosya olarak indir</button>
  <button class="btn" onclick="exportData()">📋 Yedeği panoya kopyala</button>
  <p class="tiny" style="margin:-4px 0 12px">Dosya, Dosyalar uygulamasına iner. Telefon değişirse veya veri silinirse aşağıdan geri yüklersiniz.</p>
  <textarea id="impBox" placeholder="Yedek metnini buraya yapıştırıp aşağıdaki tuşa basın"></textarea>
  <button class="btn" style="margin-top:9px" onclick="importData()">↻ Yedekten geri yükle</button>
  <div style="height:12px"></div>
  <button class="btn dan" onclick="resetAll()">Tüm verileri sil</button>
  <p class="tiny" style="text-align:center;margin:14px 0 0">MEB Fit · kişiye özel rekomposizyon programı<br>v3.0 · Ağustos 2026 · Blok düzeni + kronometre</p>`;
  $('sheetC').innerHTML=h;
  const ib=$('impBox'); if(ib) ib.value=JSON.stringify(S);
}
function openSheet(){ renderSheet(); $('sheet').classList.add('show'); }
function closeSheet(){ $('sheet').classList.remove('show'); }
function downloadBackup(){
  try{
    const blob=new Blob([JSON.stringify(S)],{type:'text/plain'});
    const u=URL.createObjectURL(blob), a=document.createElement('a');
    const d=new Date(), st=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href=u; a.download='antrenman-yedek-'+st+'.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Yedek dosyası indiriliyor');
  }catch(e){ toast('İndirilemedi — metni kopyalayın'); }
}
function exportData(){
  const s=JSON.stringify(S);
  const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999999);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(s).then(()=>toast('Yedek kopyalandı')).catch(()=>{}); }
  $('impBox').value=s;
  toast(ok?'Yedek kopyalandı':'Yedek aşağıdaki kutuda — elle kopyalayın');
}
function importData(){
  const v=$('impBox').value.trim(); if(!v){toast('Kutu boş');return;}
  try{ const o=JSON.parse(v); if(!o.logs) throw 0; S=o; if(!S.ui)S.ui={prog:'4g',day:null,week:1};
    save(); closeSheet(); render(); toast('Yedek geri yüklendi'); }
  catch(e){ toast('Geçersiz yedek metni'); }
}
function resetAll(){ if(!confirm('Tüm antrenman kayıtları, ölçümler ve işaretlemeler silinecek. Emin misiniz?'))return;
  S={logs:{},meas:{},diet:{},supp:{},ui:{prog:'4g',day:null,week:1}}; save(); closeSheet(); render(); toast('Silindi'); }

/* ---------- BAŞLAT ---------- */
function render(){
  const p=PROGRAMS[S.ui.prog];
  if(!S.ui.day || !p.days.find(d=>d.id===S.ui.day)){
    const dow=new Date().getDay();
    S.ui.day=(p.days.find(d=>d.dow===dow)||p.days[0]).id;
  }
  header();
  if(TAB==='w')renderW(); else if(TAB==='m')renderM(); else if(TAB==='d')renderD(); else renderS();
  if(TAB!=='w') $('pBar').style.width='0%';
}
ST();
render();
restResume();
setInterval(()=>{ if(TAB==='w') updateSummary(); },15000);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if(!useLS) setTimeout(()=>toast('Uyarı: tarayıcı kaydı kapalı — Ana Ekrandan açın'),1200);
setTimeout(()=>{ if(!S.seen3){ S.seen3=1; save();
  toast('v3.0 — dinlenme kronometresi ve alarm eklendi'); } },900);

</script>
